<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf9f6"><meta name="referrer" content="no-referrer"><title>RecordStudio — カメラ</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./camera.css"><script type="module" src="./camera.js"></script></head><body>
<header class="topbar"><span class="brand"><span class="brand-mark" aria-hidden="true">◉</span> RecordStudio</span><span id="camera-connection" class="pill">接続中</span></header>
<main class="camera-main"><section class="camera-intro"><div class="eyebrow">YOUR CAMERA</div><h1>このカメラの録画</h1><p id="camera-status" role="status">カメラを起動してください。</p></section>
<section class="own-camera"><div class="own-video-wrap"><video id="own-video" muted autoplay playsinline></video><span id="own-placeholder">カメラを起動</span><span id="own-recording" hidden>● 収録中</span></div><div class="own-details"><strong id="own-name">カメラ未選択</strong><span id="own-settings">—</span></div></section>
<div class="own-record-status"><time id="own-timer">00:00:00</time><div><span id="own-bytes">0 B</span><small id="own-queue"></small></div></div>
<button id="activate-camera" class="primary own-activate" disabled>カメラを起動</button>
<details class="own-options"><summary>このカメラの設定</summary><label>カメラ<select id="own-device"><option value="">自動選択</option></select></label><div class="own-option-grid"><label>画質<select id="own-quality"><option value="max">カメラの最高画質</option><option value="4k">4K</option><option value="1080">1080p</option><option value="720">720p</option></select></label><label>フレームレート<select id="own-fps"><option value="60">60 fps</option><option value="30">30 fps</option><option value="120">120 fps</option><option value="max">最大</option></select></label><label>録画形式<select id="own-codec"><option value="auto">自動</option><option value="h264">H.264</option><option value="vp8">VP8</option><option value="vp9">VP9</option><option value="av1">AV1</option></select></label><label>ビットレート<select id="own-bitrate"><option value="auto">高画質・自動</option><option value="120">120 Mbps</option><option value="80">80 Mbps</option><option value="40">40 Mbps</option><option value="20">20 Mbps</option><option value="10">10 Mbps</option></select></label></div><label class="own-audio"><input type="checkbox" id="own-audio">音声も収録</label></details>
<p id="own-message" class="notice" hidden></p><footer><span>RecordStudio</span><span>CAMERA</span></footer></main>
</body></html>
