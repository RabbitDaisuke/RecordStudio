name: Build and deploy RecordStudio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source
        run: node scripts/check.mjs
      - name: Build public
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Package standalone Node server
        run: zip -r RecordStudio-standalone.zip server.mjs server public package.json config.example.json ip.example.txt Start.cmd README.md docs LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: RecordStudio-standalone
          path: RecordStudio-standalone.zip
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
